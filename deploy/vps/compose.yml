# Barebone on a Linux x64 server. From the repository's root:
#
#   BAREBONE_PASSWORD=… docker compose -f deploy/vps/compose.yml up -d --build
#
# The desktop listens on the server itself only (127.0.0.1:3000): reach it
# through an SSH tunnel (README.md). Your phone uses the remote link (zrok),
# which Barebone opens itself.
services:
  barebone:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    image: barebone-vps
    # The app is built for x64 only (electron-builder.yml).
    platform: linux/amd64
    container_name: barebone
    # Chromium crashes pages with Docker's 64 MB /dev/shm.
    shm_size: 1gb
    security_opt:
      # Docker's own profile, plus the sandboxes a Linux desktop allows (README.md).
      - seccomp=./seccomp.json
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # The desktop's sign-in, a second lock behind the tunnel.
      - CUSTOM_USER=barebone
      - PASSWORD=${BAREBONE_PASSWORD:?Set BAREBONE_PASSWORD}
      # Closing Barebone quits it; the desktop starts it again.
      - RESTART_APP=true
      - SELKIES_MICROPHONE_ENABLED=true
      - SELKIES_MICROPHONE_ON_START=demand
      - SELKIES_ENABLE_SHARING=false
    volumes:
      # Everything that lasts: Barebone's chats and settings, the browser's
      # logins, the agents' logins, your projects.
      - config:/config
    ports:
      # BAREBONE_PORT when something else on the server has 3000.
      - 127.0.0.1:${BAREBONE_PORT:-3000}:3000
    restart: unless-stopped

volumes:
  config:
