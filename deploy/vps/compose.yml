# Barebone on a Linux x64 server. From the repository's root:
#
#   BAREBONE_ZROK_TOKEN=… docker compose -f deploy/vps/compose.yml up -d --build
#
# Nothing listens on the server: Barebone opens its remote link (zrok) itself,
# and you use it, Files and Terminal included, from your phone or computer.
services:
  barebone:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    image: barebone-vps
    # The app is built for x64 only (electron-builder.yml).
    platform: linux/amd64
    container_name: barebone
    hostname: barebone
    # Signals reach Barebone, and the processes it leaves are reaped.
    init: true
    # Chromium crashes pages with Docker's 64 MB /dev/shm.
    shm_size: 1gb
    security_opt:
      # Docker's own profile, plus Chromium's sandbox (README.md).
      - seccomp=./seccomp.json
    environment:
      # Your zrok account token, read the first time to join zrok; then kept
      # on the volume.
      - BAREBONE_ZROK_TOKEN=${BAREBONE_ZROK_TOKEN:-}
    volumes:
      # Everything that lasts: Barebone's chats and settings, the browser's
      # logins, the agents' logins, your projects.
      - config:/config
    # Quitting Barebone ends the container; Docker starts it again.
    restart: unless-stopped

volumes:
  config:
